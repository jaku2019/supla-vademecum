baseURL: https://jaku2019.github.io/supla-vademecum/
title: Vademecum Supla

# Jedyny (na razie) język – polski. Treść trafia pod /pl/,
# dzięki czemu adresy /pl/cloud/... z VitePressa pozostają bez zmian.
defaultContentLanguage: pl
defaultContentLanguageInSubdir: true
languages:
  pl:
    label: Polski
    weight: 1
    params:
      description: Opisy funkcjonalności systemu Supla

module:
  imports:
    - path: github.com/imfing/hextra

enableGitInfo: true
enableEmoji: true
enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      # surowy HTML w treści (np. <ins>)
      unsafe: true
    parser:
      attribute:
        block: true
      # pozwala przekazać atrybuty ({data-zoomable=true}) do hooka obrazków
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

menu:
  main:
    - name: Supla Cloud
      pageRef: /cloud
      weight: 1
    - name: supla.org
      url: https://supla.org
      weight: 2
    - name: Szukaj
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: https://github.com/SUPLA
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: logo.svg
      width: 28
      height: 28
    width: wide

  page:
    width: normal
    contextMenu:
      enable: false

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  displayUpdatedDate: true
  dateFormat: "02.01.2006"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: https://github.com/jaku2019/supla-vademecum/edit/main/content

  # Zoom włączany per zdjęcie atrybutem {data-zoomable=true}
  # (patrz layouts/_markup/render-image.html)
  imageZoom:
    enable: false

  highlight:
    copy:
      enable: true
      display: hover
