# Kontrola builda (bez publikacji) – zmiany z Pages CMS (gałąź cms) i PR-y do main
name: Build check

on:
  push:
    branches: [cms, supla-org]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build with Hugo
        # --panicOnWarning: np. galeria bez wymiarów zdjęcia (brakujący plik) zatrzymuje build
        run: hugo --gc --minify --panicOnWarning
